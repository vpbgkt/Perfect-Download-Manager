name: CI

# Continuous integration for the Avalonia + NativeAOT migration
# (docs/MIGRATION-AVALONIA-NATIVEAOT.md §10). Two gates:
#   1. build-test : the full solution builds and every existing test passes (the safety net that
#                   guarantees the reused engine/licensing/updater never silently regress).
#   2. aot-gate   : the core publishes with NativeAOT and the resulting native binary launches and
#                   runs a real download on a CLEAN runner — catching exactly the startup failure
#                   class (missing runtime, R2R crash, Win10 startup) that bit the framework build.

on:
  push:
    branches: [main, "release/**", "migration/**"]
  pull_request:
    branches: [main, "release/**", "migration/**"]
  # Nightly trigger for the download-engine stress soak (see the stress-soak job).
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build-test:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PDM.sln

      - name: Build
        run: dotnet build PDM.sln -c Debug --no-restore

      - name: Test
        run: dotnet test PDM.sln -c Debug --no-build

      # Guards the browser extension's interception decisions — in particular that the download is
      # cancelled BEFORE Chromium's filename barrier is released (the "Ask where to save each file"
      # fix) and that a download is never lost when the native host is missing. Dependency-free:
      # node:test against a chrome API stub. --test-force-exit because the worker leaves its own
      # timers pending by design.
      - name: Test browser extension
        run: node --test --test-force-exit browser-extension/tests/background.test.js

  # Long soak of the download-engine stress harness (tests/PDM.Core.Tests/DownloadEngineStressTests.cs).
  #
  # The stress tests already run on every push as part of build-test, but with only a handful of seeds so
  # PRs stay fast. Concurrency bugs in the engine's work-stealing splits, parallel disk writes and
  # connection retirement would most likely surface as a RARE silent wrong byte, so the real value comes
  # from accumulating many randomised runs on varied hardware over time. This job does that nightly (and
  # on demand) by raising the seed count via PDM_STRESS_SEEDS.
  stress-soak:
    name: Download engine stress soak
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PDM.sln

      - name: Build core tests
        run: dotnet build tests/PDM.Core.Tests/PDM.Core.Tests.csproj -c Debug --no-restore

      # Any failure prints the seed, so the exact scenario can be reproduced locally by adding it as an
      # InlineData case (or running the soak with that seed range).
      - name: Stress soak (many seeds)
        env:
          PDM_STRESS_SEEDS: "150"
        run: dotnet test tests/PDM.Core.Tests/PDM.Core.Tests.csproj -c Debug --no-build --filter "FullyQualifiedName~DownloadEngineStressTests"

  aot-gate:
    name: NativeAOT gate (${{ matrix.rid }} on ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted Windows runners cover the current server images. Win10 build 19041 — the
        # exact image the field crash appeared on — has no hosted runner; add a self-hosted
        # 'windows-10-19041' runner to extend this matrix to it.
        include:
          - os: windows-2022
            rid: win-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Publishes PDM.Cli with NativeAOT (trim/AOT findings fail the publish), then launches the
      # native binary and runs a real 2 MB download through the reused core over the WinHTTP path.
      - name: AOT publish + launch + download smoke
        shell: pwsh
        run: ./build/aot-harness.ps1 -Rid ${{ matrix.rid }} -SmokeUrl "https://speed.cloudflare.com/__down?bytes=2097152"

  portal-test:
    name: Portal & licensing tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install admin-portal dependencies
        working-directory: admin-portal
        run: npm ci

      - name: Run admin-portal tests
        working-directory: admin-portal
        run: npm test

      - name: Install backend/licensing dependencies
        working-directory: backend/licensing
        run: npm ci

      - name: Run backend/licensing tests
        working-directory: backend/licensing
        run: npm test

  avalonia-aot:
    name: Avalonia head NativeAOT publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Assembles the runtime-free NativeAOT dist (PDM.exe, native host, update launcher) that
      # the installer packages. Fails the job if any binary is missing. This is the single publish
      # path we ship - the old framework-dependent publish.ps1 (WPF head) has been removed.
      - name: Publish PDM (NativeAOT, runtime-free)
        shell: pwsh
        run: ./build/publish-aot-dist.ps1
